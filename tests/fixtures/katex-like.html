<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>KaTeX-like fixture</title>
  </head>
  <body>
    <p>
      Inline:
      <span class="katex">
        <span class="katex-mathml">
          <math>
            <semantics>
              <mrow></mrow>
              <annotation encoding="application/x-tex">E = mc^2</annotation>
            </semantics>
          </math>
        </span>
        <span class="katex-html" aria-hidden="true">E = mc²</span>
      </span>
    </p>

    <p class="katex-display">
      <span class="katex">
        <span class="katex-mathml">
          <math>
            <semantics>
              <mrow></mrow>
              <annotation encoding="application/x-tex">\int_0^1 x^2\,dx = \frac{1}{3}</annotation>
            </semantics>
          </math>
        </span>
        <span class="katex-html" aria-hidden="true">display formula</span>
      </span>
    </p>
  </body>
</html>
