<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Export Fixture - ChatGPT</title>
    <link rel="stylesheet" href="../../src/content/content.css">
    <style>
      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px;
        font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      article {
        margin-bottom: 22px;
        padding: 18px;
        border: 1px solid #dce5ea;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <article data-testid="conversation-turn-1">
        <div data-message-author-role="user" data-message-id="u1">
          帮我解释一下什么是梯度下降。
        </div>
      </article>

      <article data-testid="conversation-turn-2">
        <div data-message-author-role="assistant" data-message-id="a1">
          梯度下降是一种优化方法，会沿着损失函数下降最快的方向逐步更新参数。
        </div>
      </article>

      <article data-testid="conversation-turn-3">
        <div data-message-author-role="user" data-message-id="u2">
          给我一个 JavaScript 例子。
        </div>
      </article>

      <article data-testid="conversation-turn-4">
        <div data-message-author-role="assistant" data-message-id="a2">
          <pre><code>const next = value - learningRate * gradient;</code></pre>
        </div>
      </article>
    </main>

    <script src="../../src/content/exporter.js"></script>
  </body>
</html>
